name: TGJU Market Data Scraper

on:
  schedule:
    # ساعت 06:25 به وقت UTC معادل 09:55 به وقت تهران است (۵ دقیقه قبل از شروع بازه ۱۰:۰۰)
    - cron: '25 6 * * *'
  workflow_dispatch:        # قابلیت اجرای دستی از تب Actions

# جلوگیری از اجرای همزمان دو نسخه از اکشن
concurrency:
  group: price-monitoring
  cancel-in-progress: true

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright requests pytz
          playwright install --with-deps chromium

      - name: Run Price Monitor Runner
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python runner.py

      - name: Prepare Public Assets
        run: |
          mkdir -p public
          cp index.html public/ 2>/dev/null || true
          cp data.json public/ 2>/dev/null || true
          cp robots.txt public/ 2>/dev/null || true
          cp sitemap.xml public/ 2>/dev/null || true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -f "public/data.json" ]; then
            npx wrangler pages deploy public --project-name=nerkhemroozchand --branch=main
          else
            echo "خطا: فایل public/data.json یافت نشد. دیپلوی انجام نمی‌شود."
            exit 1
          fi
