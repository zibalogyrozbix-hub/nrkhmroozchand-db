name: TGJU Market Data Scraper

on:
  schedule:
    - cron: '*/20 * * * *'  # اجرای خودکار هر ۲۰ دقیقه
  workflow_dispatch:        # قابلیت اجرای دستی از تب Actions

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Scraper
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python main.py

      - name: Prepare Public Assets
        run: |
          mkdir -p public
          cp index.html public/ 2>/dev/null || true
          cp data.json public/ 2>/dev/null || true
          cp robots.txt public/ 2>/dev/null || true
          cp sitemap.xml public/ 2>/dev/null || true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy public --project-name=prices-landing-page --branch=main
