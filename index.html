<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پایگاه زنده قیمت طلا، ارز و بازارها</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3 space-x-reverse">
                <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-ping"></span>
                <h1 class="text-xl font-bold bg-gradient-to-r from-amber-400 to-amber-200 bg-clip-text text-transparent">
                    پایش زنده بازارهای مالی
                </h1>
            </div>
            <div class="text-xs text-slate-400 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
                آخرین بروزرسانی: <span id="last-update" class="text-amber-400 font-semibold">در حال دریافت...</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        
        <!-- Controls & Filter Bar -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
            <!-- Search -->
            <div class="w-full md:w-80 relative">
                <input type="text" id="search-input" placeholder="جستجوی نماد (مثلا دلار، سکه، بیت کوین)..." 
                       class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-amber-500 transition text-slate-200 placeholder-slate-500">
            </div>

            <!-- Categories -->
            <div class="flex flex-wrap gap-2 w-full md:w-auto" id="category-filters">
                <button data-cat="all" class="cat-btn active bg-amber-500 text-slate-950 font-medium text-xs px-4 py-2 rounded-lg transition">همه</button>
                <button data-cat="gold" class="cat-btn bg-slate-900 border border-slate-800 hover:border-amber-500 text-xs px-4 py-2 rounded-lg transition">طلا و سکه</button>
                <button data-cat="currency" class="cat-btn bg-slate-900 border border-slate-800 hover:border-amber-500 text-xs px-4 py-2 rounded-lg transition">ارزها</button>
                <button data-cat="crypto" class="cat-btn bg-slate-900 border border-slate-800 hover:border-amber-500 text-xs px-4 py-2 rounded-lg transition">کریپتو</button>
                <button data-cat="bourse" class="cat-btn bg-slate-900 border border-slate-800 hover:border-amber-500 text-xs px-4 py-2 rounded-lg transition">بورس و شاخص‌ها</button>
            </div>
        </div>

        <!-- Prices Table / Grid -->
        <div class="bg-slate-900/50 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 bg-slate-900 text-slate-400 text-xs uppercase tracking-wider">
                            <th class="p-4">نماد / عنوان</th>
                            <th class="p-4">قیمت / ارزش</th>
                            <th class="p-4">تغییر (مقدار)</th>
                            <th class="p-4">تغییر (درصد)</th>
                        </tr>
                    </thead>
                    <tbody id="prices-table-body" class="divide-y divide-slate-800/60 text-sm">
                        <!-- Rows rendered via JS -->
                        <tr>
                            <td colspan="4" class="text-center py-12 text-slate-500">در حال دریافت جدیدترین قیمت‌ها...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 bg-slate-900/40 py-6 text-center text-xs text-slate-500">
        <p>داده‌ها به‌صورت خودکار هر ۲۰ دقیقه بروزرسانی می‌شوند.</p>
    </footer>

    <!-- Script for Live Static Data Fetching -->
    <script>
        let allData = [];

        async function fetchMarketData() {
            try {
                // دریافت داده‌ها از فایل استاتیک data.json روی شبکه‌ی CDN کلادفلر
                const response = await fetch(`./data.json?v=${new Date().getTime()}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                allData = await response.json();

                if (allData.length > 0) {
                    document.getElementById("last-update").innerText = allData[0].updated_at || "نامشخص";
                    renderTable(allData);
                }
            } catch (err) {
                console.error("Error fetching static data:", err);
                document.getElementById("prices-table-body").innerHTML = `
                    <tr><td colspan="4" class="text-center py-8 text-rose-500">خطا در دریافت اطلاعات. لطفا دوباره تلاش کنید.</td></tr>
                `;
            }
        }

        function getCategory(key) {
            const cryptoKeys = ["btc","eth","usdt","trx","ada","sol","doge","shib","ton","xrp","ltc","bch","dot","avax","xlm","dash","bnb"];
            const bourseKeys = ["bourse_total","ifb_market1","ifb_market2","bourse_market1","bourse_market2","dow_jones","nasdaq","smi_swiss","nifty_50","ftse_100","dax","cac_40","nikkei_225","shanghai_composite","ibex_35"];
            const goldKeys = ["coin_emami","coin_azadi","coin_half","coin_quarter","coin_gram","gold_18k","gold_24k","gold_used","gold_mesghal","gold_ounce","silver_gram","abshedeh_cash","abshedeh_trade"];

            if (cryptoKeys.includes(key)) return "crypto";
            if (bourseKeys.includes(key)) return "bourse";
            if (goldKeys.includes(key) || key.includes("bubble_") || key.includes("fund_")) return "gold";
            return "currency";
        }

        function renderTable(data) {
            const tbody = document.getElementById("prices-table-body");
            tbody.innerHTML = "";

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-slate-500">هیچ موردی یافت نشد.</td></tr>`;
                return;
            }

            data.forEach(item => {
                const isNegative = item.change_percent && item.change_percent.includes("-");
                const colorClass = isNegative ? "text-rose-400" : "text-emerald-400";
                const badgeBg = isNegative ? "bg-rose-500/10 border-rose-500/20" : "bg-emerald-500/10 border-emerald-500/20";

                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-800/40 transition";
                tr.innerHTML = `
                    <td class="p-4 font-semibold text-slate-200">${item.title_fa}</td>
                    <td class="p-4 font-bold text-amber-400">${item.price}</td>
                    <td class="p-4 ${colorClass}">${item.change_amount || '0'}</td>
                    <td class="p-4">
                        <span class="inline-block px-2.5 py-1 rounded-full text-xs font-semibold border ${badgeBg} ${colorClass}">
                            ${item.change_percent || '0%'}
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Search & Filter Listeners
        document.getElementById("search-input").addEventListener("input", (e) => {
            const query = e.target.value.trim().toLowerCase();
            const filtered = allData.filter(item => item.title_fa.toLowerCase().includes(query) || item.symbol_key.toLowerCase().includes(query));
            renderTable(filtered);
        });

        document.querySelectorAll(".cat-btn").forEach(btn => {
            btn.getAttribute("data-cat");
            btn.addEventListener("click", () => {
                document.querySelectorAll(".cat-btn").forEach(b => {
                    b.classList.remove("active", "bg-amber-500", "text-slate-950");
                    b.classList.add("bg-slate-900", "text-slate-100");
                });
                btn.classList.add("active", "bg-amber-500", "text-slate-950");

                const cat = btn.getAttribute("data-cat");
                if (cat === "all") {
                    renderTable(allData);
                } else {
                    const filtered = allData.filter(item => getCategory(item.symbol_key) === cat);
                    renderTable(filtered);
                }
            });
        });

        // Initial Load
        fetchMarketData();

        // Check for updates every 60 seconds automatically
        setInterval(fetchMarketData, 60000);
    </script>
</body>
</html>
